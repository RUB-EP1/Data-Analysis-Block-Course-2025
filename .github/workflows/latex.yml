name: Render and compile exercise sheets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 pandoc latexmk texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern

      - name: Check Markdown conversion
        run: python3 scripts/test_render_tex.py

      - name: Render and compile all active Markdown sheets
        run: python3 scripts/build_attendance.py

      - name: Upload compiled PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-sheet-pdfs
          path: |
            build/attendance_exercises/*.pdf
            build/attendance_solutions/*.pdf
          if-no-files-found: error

      - name: Upload generated LaTeX and compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-build-logs
          path: |
            build/tex/**/*.tex
            build/attendance_exercises/*.log
            build/attendance_solutions/*.log
          if-no-files-found: ignore
