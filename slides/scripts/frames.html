<script>
// Frame-sequence figures: a precomputed animation with a scrub slider.
//
//   ::: {.frames data-pattern="figs/anim/homotopy/f-{n}.png" data-count="61"
//                data-label="t" data-from="0" data-to="1" data-still="1"}
//   :::
//
// or an explicit list:
//
//   ::: {.frames data-list='["figs/a.svg","figs/b.svg"]' data-labels='["a","b"]'}
//   :::
//
// Scrub with the slider, or hover the figure and use the arrow keys (Reveal
// keeps the arrows for slides everywhere else). `p` plays and pauses.
// Under ?export=1 the still frame is shown and the controls are hidden, so
// `make pdf` gets one deterministic page.
(function () {
  "use strict";

  var EXPORT = new URLSearchParams(location.search).has("export");

  function json(el, name, fallback) {
    var raw = el.getAttribute(name);
    if (!raw) return fallback;
    try { return JSON.parse(raw); } catch (e) { return fallback; }
  }

  function buildPaths(el) {
    var list = json(el, "data-list", null);
    if (Array.isArray(list) && list.length) return list;

    var pattern = el.getAttribute("data-pattern");
    var count = parseInt(el.getAttribute("data-count") || "0", 10);
    if (!pattern || !count) return [];

    var pad = parseInt(el.getAttribute("data-pad") || "3", 10);
    var start = parseInt(el.getAttribute("data-start") || "1", 10);
    var out = [];
    for (var i = 0; i < count; i++) {
      var n = String(start + i);
      while (n.length < pad) n = "0" + n;
      out.push(pattern.replace("{n}", n));
    }
    return out;
  }

  function buildLabels(el, n) {
    var labels = json(el, "data-labels", null);
    if (Array.isArray(labels) && labels.length === n) return labels;

    var name = el.getAttribute("data-label");
    if (!name) return null;

    var from = parseFloat(el.getAttribute("data-from"));
    var to = parseFloat(el.getAttribute("data-to"));
    if (isNaN(from) || isNaN(to)) return null;

    var digits = parseInt(el.getAttribute("data-digits") || "2", 10);
    var out = [];
    for (var i = 0; i < n; i++) {
      var v = n === 1 ? from : from + (to - from) * (i / (n - 1));
      out.push(name + " = " + v.toFixed(digits));
    }
    return out;
  }

  function setup(el) {
    var paths = buildPaths(el);
    if (paths.length === 0) return;

    var labels = buildLabels(el, paths.length);
    var still = parseInt(el.getAttribute("data-still") || "0", 10);
    if (!still) still = Math.ceil(paths.length / 2);
    still = Math.min(Math.max(still, 1), paths.length) - 1;

    var stage = document.createElement("div");
    stage.className = "frames-stage";
    var img = document.createElement("img");
    img.alt = el.getAttribute("data-alt") || "";
    img.src = paths[still];
    stage.appendChild(img);
    el.appendChild(stage);

    if (EXPORT) {
      el.classList.add("frames-static");
      return;
    }

    var bar = document.createElement("div");
    bar.className = "frames-bar";

    var play = document.createElement("button");
    play.className = "frames-play";
    play.type = "button";
    play.setAttribute("aria-label", "play");
    play.textContent = "▶";

    var range = document.createElement("input");
    range.className = "frames-range";
    range.type = "range";
    range.min = "0";
    range.max = String(paths.length - 1);
    range.step = "1";
    range.value = String(still);

    var readout = document.createElement("span");
    readout.className = "frames-readout";

    bar.appendChild(play);
    bar.appendChild(range);
    bar.appendChild(readout);
    el.appendChild(bar);

    var index = still;
    var timer = null;

    function show(i) {
      index = Math.min(Math.max(i, 0), paths.length - 1);
      img.src = paths[index];
      range.value = String(index);
      readout.textContent = labels
        ? labels[index]
        : index + 1 + " / " + paths.length;
    }

    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      play.textContent = "▶";
      play.setAttribute("aria-label", "play");
    }

    function start() {
      if (timer) return;
      var fps = parseFloat(el.getAttribute("data-fps") || "12");
      var loop = el.getAttribute("data-loop") !== "false";
      play.textContent = "⏸";
      play.setAttribute("aria-label", "pause");
      timer = setInterval(function () {
        if (index >= paths.length - 1) {
          if (!loop) { stop(); return; }
          show(0);
        } else {
          show(index + 1);
        }
      }, 1000 / fps);
    }

    play.addEventListener("click", function () { timer ? stop() : start(); });
    range.addEventListener("input", function () {
      stop();
      show(parseInt(range.value, 10));
    });

    // Arrow keys scrub only while the pointer is on the figure; Reveal keeps
    // them for changing slides everywhere else.
    var hot = false;
    el.addEventListener("pointerenter", function () { hot = true; });
    el.addEventListener("pointerleave", function () { hot = false; });

    document.addEventListener("keydown", function (ev) {
      if (!hot || !el.closest("section.present")) return;
      var step = ev.shiftKey ? 10 : 1;
      if (ev.key === "ArrowRight") show(index + step);
      else if (ev.key === "ArrowLeft") show(index - step);
      else if (ev.key === "Home") show(0);
      else if (ev.key === "End") show(paths.length - 1);
      else if (ev.key === "p" || ev.key === "P") { timer ? stop() : start(); }
      else return;
      ev.preventDefault();
      ev.stopPropagation();
    }, true);

    show(still);

    // Warm the browser cache so scrubbing does not flicker.
    var warm = function () {
      paths.forEach(function (p) { var i = new Image(); i.src = p; });
    };
    if (window.requestIdleCallback) requestIdleCallback(warm, { timeout: 3000 });
    else setTimeout(warm, 800);

    el._framesStop = stop;
    el._framesStart = start;
  }

  function init() {
    document.querySelectorAll(".frames").forEach(setup);

    if (EXPORT) return;
    // Reveal is constructed by Quarto's own init, which may not have run yet.
    window.addEventListener("load", bindReveal);
  }

  function bindReveal() {
    if (!window.Reveal || typeof Reveal.on !== "function") return;
    Reveal.on("slidechanged", function (ev) {
      document.querySelectorAll(".frames").forEach(function (el) {
        if (el._framesStop) el._framesStop();
      });
      if (!ev.currentSlide) return;
      ev.currentSlide.querySelectorAll(".frames[data-autoplay]").forEach(
        function (el) { if (el._framesStart) el._framesStart(); }
      );
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
