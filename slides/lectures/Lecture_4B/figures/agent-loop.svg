<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#172635">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="40.0" y="160.0" width="330.0" height="210.0" rx="12" fill="#e9f5fd" stroke="#087bb9" stroke-width="3"/>
<text x="205.0" y="196.0" font-size="25" text-anchor="middle" fill="#087bb9" font-weight="bold">Context</text>
<text x="205.0" y="232.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">system prompt, tools,</text>
<text x="205.0" y="262.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">memory files,</text>
<text x="205.0" y="292.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">conversation so far,</text>
<text x="205.0" y="322.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">tool results</text>
<rect x="510.0" y="40.0" width="330.0" height="150.0" rx="12" fill="#f1eafa" stroke="#7a4fb3" stroke-width="3"/>
<text x="675.0" y="76.0" font-size="25" text-anchor="middle" fill="#7a4fb3" font-weight="bold">Model</text>
<text x="675.0" y="112.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">reads everything,</text>
<text x="675.0" y="142.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">writes text or a tool call</text>
<rect x="980.0" y="160.0" width="330.0" height="210.0" rx="12" fill="#fff1cf" stroke="#d99700" stroke-width="3"/>
<text x="1145.0" y="196.0" font-size="25" text-anchor="middle" fill="#d99700" font-weight="bold">Harness</text>
<text x="1145.0" y="232.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">checks permissions,</text>
<text x="1145.0" y="262.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">runs the tool (sandbox),</text>
<text x="1145.0" y="292.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">validates: lint, tests,</text>
<text x="1145.0" y="322.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">adds reminders</text>
<rect x="510.0" y="400.0" width="330.0" height="130.0" rx="12" fill="#f3f6f8" stroke="#617484" stroke-width="3"/>
<text x="675.0" y="436.0" font-size="25" text-anchor="middle" fill="#617484" font-weight="bold">Tool result</text>
<text x="675.0" y="472.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">output, error, or</text>
<text x="675.0" y="502.0" font-size="21" text-anchor="middle" fill="#172635" font-weight="normal">“user declined”</text>
<path d="M370,210 C430,150 450,120 506,115" fill="none" stroke="#172635" stroke-width="3" marker-end="url(#arr)"/>
<text x="420.0" y="128.0" font-size="20" text-anchor="middle" fill="#617484" font-weight="normal">call</text>
<path d="M842,115 C900,120 930,150 976,210" fill="none" stroke="#172635" stroke-width="3" marker-end="url(#arr)"/>
<text x="935.0" y="128.0" font-size="20" text-anchor="middle" fill="#617484" font-weight="normal">tool call</text>
<path d="M1140,372 C1120,440 920,470 844,465" fill="none" stroke="#172635" stroke-width="3" marker-end="url(#arr)"/>
<text x="1050.0" y="470.0" font-size="20" text-anchor="middle" fill="#617484" font-weight="normal">executes</text>
<path d="M508,465 C420,470 250,440 205,374" fill="none" stroke="#172635" stroke-width="3" marker-end="url(#arr)"/>
<text x="300.0" y="470.0" font-size="20" text-anchor="middle" fill="#617484" font-weight="normal">appended</text>
<path d="M675,40 C675,0 1400,0 1440,90" fill="none" stroke="#3c8d52" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/>
<text x="1545.0" y="118.0" font-size="21" text-anchor="end" fill="#3c8d52" font-weight="bold">no tool call:</text>
<text x="1545.0" y="146.0" font-size="21" text-anchor="end" fill="#3c8d52" font-weight="normal">answer to the user</text>
</svg>
