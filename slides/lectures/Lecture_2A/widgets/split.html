<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where should the tree split?</title><link rel="stylesheet" href="lab.css"></head><body data-mode="split"><header><h1>Where should the tree split?</h1><span class="legend"><span class="signal">● signal</span> &nbsp; <span class="background">● background</span></span></header><p class="subtitle">Compare the weighted impurity of the children with the impurity of the parent.</p><div class="controls"><label for="cut">Cut <input id="cut" type="range" min="0" max="1" step="0.005" value="0.5"><output id="cut-value" for="cut">0.5</output></label><label for="criterion">Criterion <select id="criterion"><option value="gini">Gini</option><option value="entropy">Entropy</option></select></label><button id="best">Find best cut</button><button id="reset">Reset</button></div><canvas id="plot" width="1600" height="530" role="img" aria-label="Where should the tree split?: plots update with the labelled controls"></canvas><div id="stats" class="stats" aria-live="polite"></div><p class="prompt">A pure but tiny child may give little gain. Both children contribute in proportion to their size.</p><script src="data.js"></script><script src="lab.js"></script></body></html>
