<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdaBoost pays attention to mistakes</title><link rel="stylesheet" href="lab.css"></head><body data-mode="boost"><header><h1>AdaBoost pays attention to mistakes</h1><span class="legend"><span class="signal">● signal</span> &nbsp; <span class="background">● background</span></span></header><p class="subtitle">Point areas on the left represent weights BEFORE fitting the selected stump.</p><div class="controls"><label for="round">Round <input id="round" type="range" min="1" max="20" step="1" value="1"><output id="round-value" for="round">1</output></label><button id="next">Next round →</button><button id="reset">Reset</button></div><canvas id="plot" width="1600" height="530" role="img" aria-label="AdaBoost pays attention to mistakes: plots update with the labelled controls"></canvas><div id="stats" class="stats" aria-live="polite"></div><p class="prompt">Move to the next round and watch the previously misclassified points grow. The right panel combines all stumps so far.</p><script src="data.js"></script><script src="lab.js"></script></body></html>
