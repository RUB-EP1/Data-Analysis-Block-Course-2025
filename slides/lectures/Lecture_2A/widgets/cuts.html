<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One cut, three competing goals</title><link rel="stylesheet" href="lab.css"></head><body data-mode="cuts"><header><h1>One cut, three competing goals</h1><span class="legend"><span class="signal">● signal</span> &nbsp; <span class="background">● background</span></span></header><p class="subtitle">Signal: Beta(2,5). Background: Beta(5,2). The shaded region passes the cut.</p><div class="controls"><label for="cut">Cut <input id="cut" type="range" min="0" max="1" step="0.005" value="0.5"><output id="cut-value" for="cut">0.5</output></label><label for="fraction">Signal fraction <input id="fraction" type="range" min="0.1" max="0.9" step="0.1" value="0.5"><output id="fraction-value" for="fraction">0.5</output></label><button id="reset">Reset</button></div><canvas id="plot" width="1600" height="530" role="img" aria-label="One cut, three competing goals: plots update with the labelled controls"></canvas><div id="stats" class="stats" aria-live="polite"></div><p class="prompt">Keep the cut fixed and change the signal fraction. Which numbers change, and which stay fixed?</p><script src="data.js"></script><script src="lab.js"></script></body></html>
