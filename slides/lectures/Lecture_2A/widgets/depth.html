<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth, overtraining, and bagging</title><link rel="stylesheet" href="lab.css"></head><body data-mode="depth"><header><h1>Depth, overtraining, and bagging</h1><span class="legend"><span class="signal">● signal</span> &nbsp; <span class="background">● background</span></span></header><p class="subtitle">Same training data, separate validation data. Gold = signal; blue = background.</p><div class="controls"><label for="depth">Tree depth <input id="depth" type="range" min="1" max="10" step="1" value="3"><output id="depth-value" for="depth">3</output></label><label for="trees">Bagged trees <input id="trees" type="range" min="1" max="30" step="1" value="30"><output id="trees-value" for="trees">30</output></label><label for="sample">Points <select id="sample"><option value="train">Training</option><option value="validation">Validation</option></select></label><button id="reset">Reset</button></div><canvas id="plot" width="1600" height="530" role="img" aria-label="Depth, overtraining, and bagging: plots update with the labelled controls"></canvas><div id="stats" class="stats" aria-live="polite"></div><p class="prompt">Increase depth, then switch to validation points. Bagging uses bootstrap samples and both features at each split.</p><script src="data.js"></script><script src="lab.js"></script></body></html>
