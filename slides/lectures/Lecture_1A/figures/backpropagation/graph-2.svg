<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 370" role="img" aria-label="Forward computation values and reverse sensitivities for the worked example"><defs><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bbc2c8"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d91e0b"/></marker></defs><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif"><polyline points="230,77 295,77 295,150 355,150" fill="none" stroke="#bbc2c8" stroke-width="3" marker-end="url(#grey)"/><polyline points="230,247 295,247 295,195 355,195" fill="none" stroke="#bbc2c8" stroke-width="3" marker-end="url(#grey)"/><polyline points="575,150 630,150 630,62 685,62" fill="none" stroke="#bbc2c8" stroke-width="3" marker-end="url(#grey)"/><polyline points="905,62 970,62 970,150 1020,150" fill="none" stroke="#bbc2c8" stroke-width="3" marker-end="url(#grey)"/><polyline points="575,190 610,190 610,297 980,297 980,190 1020,190" fill="none" stroke="#bbc2c8" stroke-width="3" marker-end="url(#grey)"/><polyline points="1370,172 1240,172" fill="none" stroke="#d91e0b" stroke-width="5" marker-end="url(#red)"/><text x="1505" y="55" text-anchor="middle" font-size="27" fill="#007dc5">target t = 5</text><polyline points="1505,68 1505,130" fill="none" stroke="#bbc2c8" stroke-width="3" marker-end="url(#grey)"/><g><rect x="50" y="35" width="180" height="85" rx="19" fill="#f2faff" stroke="#007dc5" stroke-width="3"/><text x="140" y="69" text-anchor="middle" font-size="28" fill="#111">w</text><text x="140" y="104" text-anchor="middle" font-size="29" fill="#007dc5">1</text></g><g><rect x="50" y="205" width="180" height="85" rx="19" fill="#f2faff" stroke="#007dc5" stroke-width="3"/><text x="140" y="239" text-anchor="middle" font-size="28" fill="#111">x</text><text x="140" y="274" text-anchor="middle" font-size="29" fill="#007dc5">2</text></g><g><rect x="355" y="130" width="220" height="85" rx="19" fill="#f2faff" stroke="#007dc5" stroke-width="3"/><text x="465" y="164" text-anchor="middle" font-size="28" fill="#111">a = wx</text><text x="465" y="199" text-anchor="middle" font-size="29" fill="#007dc5">2</text></g><g><rect x="685" y="20" width="220" height="85" rx="19" fill="#f2faff" stroke="#007dc5" stroke-width="3"/><text x="795" y="54" text-anchor="middle" font-size="28" fill="#111">b = a²</text><text x="795" y="89" text-anchor="middle" font-size="29" fill="#007dc5">4</text></g><g><rect x="1020" y="130" width="220" height="85" rx="19" fill="#fff5f3" stroke="#d91e0b" stroke-width="3"/><text x="1130" y="164" text-anchor="middle" font-size="28" fill="#111">c = b + a</text><text x="1130" y="199" text-anchor="middle" font-size="29" fill="#007dc5">6</text><text x="1130" y="245" text-anchor="middle" font-size="25" fill="#d91e0b">∂L/∂c = 1</text></g><g><rect x="1370" y="130" width="270" height="85" rx="19" fill="#fff5f3" stroke="#d91e0b" stroke-width="3"/><text x="1505" y="164" text-anchor="middle" font-size="28" fill="#111">L = ½(c − t)²</text><text x="1505" y="199" text-anchor="middle" font-size="29" fill="#007dc5">0.5</text><text x="1505" y="245" text-anchor="middle" font-size="25" fill="#d91e0b">∂L/∂L = 1</text></g><text x="790" y="333" text-anchor="middle" font-size="23" fill="#5e5e5e">direct path from a to c</text><text x="45" y="362" font-size="22" fill="#007dc5">Blue: forward values</text><text x="340" y="362" font-size="22" fill="#d91e0b">Red: backward sensitivities</text></g></svg>