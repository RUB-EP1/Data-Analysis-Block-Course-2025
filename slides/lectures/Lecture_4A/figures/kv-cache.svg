<text x="286.0" y="386.0" font-size="18" text-anchor="middle" fill="#617484" font-weight="normal">keys of all previous tokens</text>
<text x="640.0" y="100.0" font-size="24" text-anchor="start" fill="#172635" font-weight="bold">KV cache</text>
<text x="640.0" y="132.0" font-size="20" text-anchor="start" fill="#172635" font-weight="normal">keys and values of earlier tokens never change:</text>
<text x="640.0" y="160.0" font-size="20" text-anchor="start" fill="#172635" font-weight="normal">store them instead of recomputing them.</text>
<text x="640.0" y="214.0" font-size="20" text-anchor="start" fill="#087bb9" font-weight="normal">cost per new token ∝ tokens so far (not their square)</text>
<text x="640.0" y="268.0" font-size="20" text-anchor="start" fill="#172635" font-weight="normal">memory per token = 2 × layers × heads × d_head numbers</text>
<text x="640.0" y="300.0" font-size="20" text-anchor="start" fill="#617484" font-weight="normal">GPT-2 small: 2 × 12 × 12 × 64 = 18 432 numbers ≈ 37 kB (16-bit)</text>
<text x="640.0" y="332.0" font-size="20" text-anchor="start" fill="#617484" font-weight="normal">DeepSeek-R1 with standard attention: ~4 MB per token</text>
<text x="640.0" y="364.0" font-size="20" text-anchor="start" fill="#617484" font-weight="normal">with multi-head latent attention (MLA): ~70 kB per token</text>
