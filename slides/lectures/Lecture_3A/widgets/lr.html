<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choosing the learning rate</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<header><h1>Choosing the learning rate</h1><span class="legend">update: <i>w</i> ← <i>w</i> − η <i>L</i>′(<i>w</i>)</span></header>
<p class="subtitle">Gradient descent only sees the local slope. The learning rate η decides how far to trust it.</p>
<div class="controls">
  <label for="loss">Loss <select id="loss"><option value="quad">quadratic ½w²</option><option value="well">two minima</option></select></label>
  <label for="eta">η <input id="eta" type="range" min="-2" max="0.5" step="0.01" value="-0.7"><output id="eta-value"></output></label>
  <label for="w0">start w₀ <input id="w0" type="range" min="-3.5" max="3.5" step="0.05" value="2.8"><output id="w0-value"></output></label>
  <button id="step">Step</button><button id="run">Run 25 steps</button><button id="reset">Reset</button>
</div>
<canvas id="plot" width="1600" height="540" role="img" aria-label="Loss curve with gradient-descent iterates, and loss versus iteration"></canvas>
<div id="stats" class="stats" aria-live="polite"></div>
<p class="prompt" id="prompt">For ½w² the curvature is 1: try η = 0.3, 1.5 and 2.2. With two minima, change the start point.</p>
<script src="plot.js"></script>
<script>
const C = $('plot'), ctx = C.getContext('2d');
const LOSS = {
  quad: { f: w => 0.5 * w * w, d: w => w, dd: () => 1, yr: [-0.3, 7] },
  well: { f: w => 0.05 * w ** 4 - 0.6 * w * w + 0.3 * w + 1.5, d: w => 0.2 * w ** 3 - 1.2 * w + 0.3, dd: w => 0.6 * w * w - 1.2, yr: [-1.3, 3.2] }
};
let path = [], timer = null;
const eta = () => 10 ** +$('eta').value;

function reset() { path = [+$('w0').value]; draw(); }
function step() {
  const L = LOSS[$('loss').value], w = path[path.length - 1];
  if (Math.abs(w) > 1e6 || !isFinite(w)) return;
  path.push(w - eta() * L.d(w));
  draw();
}

function draw() {
  syncOutputs({ eta: v => (10 ** v).toFixed(10 ** v < 0.1 ? 3 : 2), w0: v => v.toFixed(2) });
  const L = LOSS[$('loss').value];
  ctx.clearRect(0, 0, C.width, C.height);
  const P = new Panel(ctx, 90, 40, 860, 440, [-4, 4], L.yr);
  P.frame('Loss L(w)', 'w', 'L(w)', [-4, -2, 0, 2, 4], [0, 1, 2, 3].filter(v => v <= L.yr[1]), v => v.toFixed(0));
  P.fn(L.f, '#5b9bd5', 6, [], 600);
  // Tangent at the current point: the only information the algorithm has.
  const w = path[path.length - 1];
  if (isFinite(w) && Math.abs(w) < 4) {
    const s = L.d(w), f0 = L.f(w);
    P.clip(() => P.line([[w - 0.9, f0 - 0.9 * s], [w + 0.9, f0 + 0.9 * s]], PAL.ink, 2, [8, 6]));
  }
  P.clip(() => {
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i];
      if (!isFinite(b) || Math.abs(a) > 50) break;
      arrow(ctx, P.X(a), P.Y(L.f(a)), P.X(b), P.Y(L.f(b)), PAL.ink, 2.2, 13);
    }
    path.forEach((p, i) => { if (Math.abs(p) < 50) P.dot(p, L.f(p), i === 0 ? PAL.red : PAL.ink, i === 0 ? 11 : 7); });
  });
  text(ctx, 'start', P.X(Math.max(-3.8, Math.min(3.8, path[0]))) + 14, P.Y(L.f(path[0])) + 6, 19, PAL.red);

  // Right: loss versus iteration on a log scale.
  const vals = path.map(p => L.f(p) - (($('loss').value === 'well') ? -1.0527 : 0));
  const Q = new Panel(ctx, 1100, 40, 440, 440, [0, 25], [-4, 2]);
  Q.frame($('loss').value === 'well' ? 'L − L_min (global) per step' : 'L per step', 'iteration', 'log₁₀', [0, 5, 10, 15, 20, 25], [-4, -2, 0, 2], v => v.toFixed(0));
  Q.clip(() => {
    Q.line(vals.map((v, i) => [i, Math.log10(Math.max(v, 1e-6))]), PAL.accent, 3);
    vals.forEach((v, i) => Q.dot(i, Math.log10(Math.max(v, 1e-6)), PAL.accent, 5));
  });

  const cur = path[path.length - 1], wstar = $('loss').value === 'quad' ? 0 : (cur < 0.2527 ? -2.566 : 2.3134);
  const h = L.dd(wstar), r = eta() * h;
  let regime = r < 1 ? 'monotone approach' : r < 2 ? 'zig-zag, converges' : 'diverges';
  stats([
    ['Steps', path.length - 1],
    ['Current w', isFinite(cur) ? (Math.abs(cur) > 1e4 ? cur.toExponential(1) : cur.toFixed(3)) : '∞'],
    ['L(w)', isFinite(cur) ? (Math.abs(cur) > 1e4 ? '→ ∞' : L.f(cur).toFixed(4)) : '∞'],
    ['η · L″(w*) near this minimum', `${r.toFixed(2)}  (${regime})`]
  ]);
}

$('step').onclick = step;
$('run').onclick = () => {
  if (timer) return;
  let n = 0;
  timer = setInterval(() => { step(); if (++n >= 25) { clearInterval(timer); timer = null; } }, 110);
};
$('reset').onclick = () => { clearInterval(timer); timer = null; reset(); };
document.querySelectorAll('input,select').forEach(e => e.addEventListener('input', () => { clearInterval(timer); timer = null; reset(); }));
reset();
if (new URLSearchParams(location.search).has('demo')) { $('eta').value = Math.log10(1.6); reset(); for (let i = 0; i < 14; i++) step(); }
</script>
</body>
</html>
